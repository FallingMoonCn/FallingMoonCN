<!doctype html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="FALLINGMOON 官方网站。前卫器乐金属摇滚。">
  <meta name="theme-color" content="#0d0f0f">
  <meta property="og:title" content="FALLINGMOON — Official">
  <meta property="og:description" content="Progressive instrumental metal rock from China.">
  <meta property="og:type" content="website">
  <title>FALLINGMOON — Official</title>
  <link rel="icon" type="image/png" href="img/FALLINGMOON.png">
  <link rel="stylesheet" href="styles.css">
</head>

<body>
  <header class="site-header" id="siteHeader">
    <nav class="site-nav shell" aria-label="主导航">
      <a class="brand" href="#top" aria-label="回到首页">
        <span class="brand__name brand__glyph-word" data-glyph-word="FALLINGMOON" aria-label="FALLINGMOON"></span>
      </a>

      <button class="menu-toggle" id="menuToggle" type="button" aria-label="打开导航" aria-expanded="false">
        <span></span><span></span>
      </button>

      <div class="nav-panel" id="navPanel">
        <a class="nav-link is-active" href="index.html">首页</a>
        <a class="nav-link" href="music.html">音乐</a>
        <a class="nav-link" href="about.html">关于</a>
        <a class="nav-link" href="#merch">周边</a>
        <a class="nav-link nav-link--contact" href="contact.html">联系乐队 <span>↗</span></a>
      </div>

    </nav>
  </header>

  <main id="top">
    <section class="hero" aria-labelledby="heroTitle">
      <div class="hero__image-wrap" aria-hidden="true">
        <img class="hero__image" src="img/FALLINGMOON.png" alt="FALLINGMOON 标志图">
      </div>
      <div class="hero__content shell">
        <h1 class="hero__title" id="heroTitle" aria-label="FALLINGMOON">
          <span class="hero__glyph-row" data-glyph-word="FALLING" aria-hidden="true"></span>
          <span class="hero__glyph-row hero__glyph-row--outline" data-glyph-word="MOON" aria-hidden="true"></span>
        </h1>
        <div class="hero__bottom">
          <p class="hero__lead">前卫器乐金属 / 器乐摇滚<br>复杂节拍，低频与空间。</p>
          <div class="hero__actions">
            <a class="button button--dark" href="#music">听 BLOSSOM <span>↘</span></a>
            <a class="text-link" href="about.html">关于乐队 <span>↗</span></a>
          </div>
        </div>
      </div>
    </section>

    <section class="section music-section" id="music" aria-labelledby="musicTitle">
      <div class="shell">
        <div class="home-overview reveal">
          <article class="overview-block overview-release">
            <div class="overview-heading"><h2 id="musicTitle">NEW RELEASE</h2><a href="music.html" aria-label="查看全部音乐">more <span>▶</span></a></div>
            <div class="release-gallery" id="release-details">
              <a class="release-gallery__item" href="music.html"><img src="img/封面/EP/BLOSSOM.jpg" alt="BLOSSOM EP 封面"><span>BLOSSOM ↗</span></a>
              <a class="release-gallery__item" href="music.html"><img src="img/封面/单曲/WHITE NOISE_封面.jpg" alt="WHITE NOISE 单曲封面"><span>WHITE NOISE ↗</span></a>
            </div>
          </article>

          <article class="overview-block overview-news">
            <div class="overview-heading"><h2>NEWS</h2></div>
            <ul>
              <li><a href="#release-details">BLOSSOM / EP OUT NOW</a></li>
              <li><a href="#release-details">WHITE NOISE / SINGLE</a></li>
              <li><a href="about.html">NEW MATERIAL IN PROGRESS</a></li>
            </ul>
          </article>
        </div>
      </div>
    </section>

    <section class="video-section section" id="video" aria-labelledby="videoTitle">
      <div class="shell">
        <div class="section-heading section-heading--row">
          <h2 id="videoTitle">VIDEO</h2>
          <a class="section-link" href="https://www.bilibili.com/video/BV14JcdehEM6/" target="_blank" rel="noopener">打开 Bilibili ↗</a>
        </div>
        <div class="video-frame">
          <iframe src="https://player.bilibili.com/player.html?bvid=BV14JcdehEM6&amp;page=1&amp;danmaku=0" title="FALLINGMOON 视频" scrolling="no" border="0" frameborder="no" framespacing="0" allowfullscreen="true"></iframe>
        </div>
      </div>
    </section>

    <section class="merch-section section" id="merch" aria-labelledby="merchTitle">
      <div class="shell">
        <div class="section-heading section-heading--row">
          <h2 id="merchTitle">MERCH</h2>
          <span class="section-link">周边</span>
        </div>
        <div class="merch-grid">
          <a class="merch-card merch-card--pick" href="周边物料/拨片.jpg" target="_blank" rel="noopener">
            <img src="周边物料/拨片.jpg" alt="FALLINGMOON 拨片">
            <span>拨片 ↗</span>
          </a>
          <a class="merch-card merch-card--cup" href="周边物料/水杯.jpg" target="_blank" rel="noopener">
            <img src="周边物料/水杯.jpg" alt="FALLINGMOON 水杯">
            <span>水杯 ↗</span>
          </a>
        </div>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="shell site-footer__inner">
      <span>© 2026 FALLINGMOON</span>
      <span>FALLINGMOON</span>
    </div>
  </footer>

  <script src="script.js"></script>
</body>

</html>
